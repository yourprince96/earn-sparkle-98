<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 p-4">
<div id="login" class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><h2 class="font-bold">Admin Login - admin123</h2><input id="pass" type="password" class="w-full border p-3 mt-3 rounded-xl"><button onclick="login()" class="w-full bg-black text-white py-3 mt-3 rounded-xl">Login</button></div>
<div id="panel" class="hidden max-w-3xl mx-auto"><h1 class="text-xl font-black">Admin Control</h1>
<div class="grid md:grid-cols-2 gap-4 mt-4">
<div class="bg-white p-4 rounded-2xl"><h3 class="font-bold">Task1-ID বিক্রি</h3><input id="t1Title" placeholder="Title" class="border p-2 w-full mt-2 rounded"><input id="t1Reward" placeholder="Reward" class="border p-2 w-full mt-2 rounded"><button onclick="add('task1')" class="bg-green-600 text-white w-full py-2 mt-2 rounded">Add</button><div id="list_task1" class="text-xs mt-2"></div></div>
<div class="bg-white p-4 rounded-2xl"><h3 class="font-bold">Task2-Visit</h3><input id="t2Title" placeholder="Title" class="border p-2 w-full mt-2 rounded"><input id="t2Reward" placeholder="Reward" class="border p-2 w-full mt-2 rounded"><button onclick="add('task2')" class="bg-blue-600 text-white w-full py-2 mt-2 rounded">Add</button><div id="list_task2" class="text-xs mt-2"></div></div>
<div class="bg-white p-4 rounded-2xl"><h3 class="font-bold">Task3-Coin</h3><input id="t3Title" placeholder="Coin" class="border p-2 w-full mt-2 rounded"><input id="t3Reward" placeholder="Reward" class="border p-2 w-full mt-2 rounded"><button onclick="add('task3')" class="bg-yellow-600 text-white w-full py-2 mt-2 rounded">Add</button><div id="list_task3" class="text-xs mt-2"></div></div>
<div class="bg-white p-4 rounded-2xl"><h3 class="font-bold">Task4-SMS Mining</h3><input id="t4Title" placeholder="WA/TG Code" class="border p-2 w-full mt-2 rounded"><input id="t4Reward" placeholder="Reward" class="border p-2 w-full mt-2 rounded"><button onclick="add('task4')" class="bg-purple-600 text-white w-full py-2 mt-2 rounded">Add</button><div id="list_task4" class="text-xs mt-2"></div></div>
</div>
<div class="bg-white p-4 rounded-2xl mt-4"><h3 class="font-bold">VIP Plan</h3><input id="pName" placeholder="VIP1" class="border p-2 w-full mt-2 rounded"><input id="pPrice" placeholder="Price" class="border p-2 w-full mt-2 rounded"><input id="pIncome" placeholder="Daily Income" class="border p-2 w-full mt-2 rounded"><button onclick="addPlan()" class="bg-black text-white w-full py-2 mt-2 rounded">Add Plan</button><div id="list_plans" class="text-xs mt-2"></div></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyADgDf6LWDoZfbB52RhMY05IghrnM9PVic", authDomain: "task-earn-pro-ffcfd.firebaseapp.com", databaseURL: "https://task-earn-pro-ffcfd-default-rtdb.firebaseio.com", projectId: "task-earn-pro-ffcfd", storageBucket: "task-earn-pro-ffcfd.firebasestorage.app", messagingSenderId: "637717717976", appId: "1:637717717976:web:121119866d12c0517908ad", measurementId: "G-42GP9SL128" };
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.login=()=>{ if(pass.value==="admin123"){ login.classList.add("hidden"); panel.classList.remove("hidden"); loadAll(); } else alert("Wrong"); }
window.add=async(t)=>{ const title=document.getElementById('t'+t.slice(-1)+'Title').value; const reward=document.getElementById('t'+t.slice(-1)+'Reward').value; await addDoc(collection(db,t),{title,reward:Number(reward)||10}); alert("Added"); loadAll(); }
window.addPlan=async()=>{ await addDoc(collection(db,"plans"),{name:pName.value,price:Number(pPrice.value),income:pIncome.value}); alert("Plan Added"); loadAll(); }
async function loadAll(){ for(let t of ['task1','task2','task3','task4','plans']){ const snap=await getDocs(collection(db,t)); let h=""; snap.forEach(d=>{ h+=`<div class='flex justify-between border-b py-1'><span>${d.data().title||d.data().name}</span><button onclick="del('${t}','${d.id}')" class='text-red-500'>X</button></div>`; }); const el=document.getElementById('list_'+t); if(el) el.innerHTML=h; } }
window.del=async(c,i)=>{ if(confirm("Delete?")){ await deleteDoc(doc(db,c,i)); loadAll(); } }
</script></body></html>
